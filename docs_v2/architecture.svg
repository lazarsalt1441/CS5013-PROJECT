<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <defs>
    <style>
      .box { fill:#f8f5ef; stroke:#2f3e46; stroke-width:2; rx:14; }
      .accent { fill:#e9c46a; stroke:#8a6422; stroke-width:2; rx:14; }
      .engine { fill:#cfe0f3; stroke:#2c5d8a; stroke-width:2; rx:14; }
      .ok { fill:#b7d7c0; stroke:#356859; stroke-width:2; rx:14; }
      .bad { fill:#f2c6c2; stroke:#9f3a38; stroke-width:2; rx:14; }
      .title { font:700 27px sans-serif; fill:#1f2933; }
      .label { font:600 18px sans-serif; fill:#1f2933; text-anchor:middle; }
      .small { font:14px sans-serif; fill:#37474f; text-anchor:middle; }
      .tag { font:italic 14px sans-serif; fill:#455a64; text-anchor:middle; }
      .arrow { stroke:#455a64; stroke-width:3; fill:none; marker-end:url(#head); }
    </style>
    <marker id="head" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#455a64"/>
    </marker>
  </defs>
  <text x="600" y="45" class="title" text-anchor="middle">IITM Explainable Slotbook v2 - System Flow</text>

  <rect x="30" y="185" width="160" height="90" class="box"/>
  <text x="110" y="220" class="label">CSV datasets</text>
  <text x="110" y="246" class="small">courses, slots, prefs</text>

  <rect x="230" y="185" width="150" height="90" class="box"/>
  <text x="305" y="220" class="label">Parser</text>
  <text x="305" y="246" class="small">records + TimeGrid</text>

  <rect x="420" y="185" width="150" height="90" class="accent"/>
  <text x="495" y="220" class="label">Validator</text>
  <text x="495" y="246" class="small">18 input checks</text>

  <rect x="420" y="345" width="150" height="80" class="bad"/>
  <text x="495" y="378" class="label">Validation report</text>
  <text x="495" y="404" class="small">actionable errors</text>

  <rect x="615" y="85" width="190" height="90" class="engine"/>
  <text x="710" y="120" class="label">UniTime cpsolver</text>
  <text x="710" y="146" class="small">IFS + hill climb + deluge</text>
  <text x="710" y="76" class="tag">default</text>

  <rect x="615" y="285" width="190" height="90" class="accent"/>
  <text x="710" y="320" class="label">CP-SAT (v1)</text>
  <text x="710" y="346" class="small">exact reference</text>
  <text x="710" y="400" class="tag">--solver cpsat</text>

  <rect x="850" y="185" width="150" height="90" class="ok"/>
  <text x="925" y="220" class="label">Solution</text>
  <text x="925" y="246" class="small">slot per course</text>

  <rect x="1030" y="85" width="150" height="80" class="box"/>
  <text x="1105" y="118" class="label">Explanations</text>
  <text x="1105" y="144" class="small">reasons + alternatives</text>

  <rect x="1030" y="200" width="150" height="80" class="box"/>
  <text x="1105" y="233" class="label">JavaFX UI</text>
  <text x="1105" y="259" class="small">solver dropdown</text>

  <rect x="1030" y="315" width="150" height="80" class="box"/>
  <text x="1105" y="348" class="label">CSV exports</text>
  <text x="1105" y="374" class="small">slotbook + audit</text>

  <path d="M190 230 H230" class="arrow"/>
  <path d="M380 230 H420" class="arrow"/>
  <path d="M495 275 V345" class="arrow"/>
  <path d="M570 215 C595 215 590 130 615 130" class="arrow"/>
  <path d="M570 245 C595 245 590 330 615 330" class="arrow"/>
  <path d="M805 130 C830 130 825 215 850 215" class="arrow"/>
  <path d="M805 330 C830 330 825 245 850 245" class="arrow"/>
  <path d="M1000 215 C1015 215 1015 125 1030 125" class="arrow"/>
  <path d="M1000 235 H1030" class="arrow"/>
  <path d="M1000 255 C1015 255 1015 355 1030 355" class="arrow"/>

  <rect x="230" y="455" width="770" height="70" class="box"/>
  <text x="615" y="485" class="label">Shared by every component: TimeGrid (what overlaps) and Objective (what it costs)</text>
  <text x="615" y="510" class="small">validator, both solvers, explanations and test oracles use the same rules</text>
</svg>
