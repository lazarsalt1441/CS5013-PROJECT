name: Project CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run portal API contract tests
        working-directory: portal
        run: npm test

      - name: Validate portal assets and CSV contracts
        working-directory: portal
        run: npm run check

      - name: Validate mid-evaluation demo fixture
        run: node scripts/validate_demo.mjs

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compile and run tests
        run: mvn --batch-mode --no-transfer-progress clean test

      - name: Run feasible CLI demonstration (UniTime)
        run: >-
          mvn --batch-mode --no-transfer-progress exec:java
          -Dexec.args="--input data/feasible --output output/ci-demo --time-limit 3"

      - name: Run feasible CLI demonstration (CP-SAT)
        run: >-
          mvn --batch-mode --no-transfer-progress exec:java
          -Dexec.args="--input data/feasible --output output/ci-demo-cpsat --solver cpsat"

      - name: Generate mid-evaluation showcase (UniTime)
        run: >-
          mvn --batch-mode --no-transfer-progress exec:java
          -Dexec.args="--input data/demo-showcase --output output/demo-showcase --time-limit 10"

      - name: Generate mid-evaluation showcase (CP-SAT reference)
        run: >-
          mvn --batch-mode --no-transfer-progress exec:java
          -Dexec.args="--input data/demo-showcase --output output/demo-showcase-cpsat --solver cpsat --time-limit 10"

      - name: Upload generated showcase slotbooks
        uses: actions/upload-artifact@v4
        with:
          name: demo-showcase-results
          path: |
            output/demo-showcase/
            output/demo-showcase-cpsat/
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
