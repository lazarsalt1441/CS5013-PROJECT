name: Quality

# The practices from CS5013 Modules 4, 5, 7 and 9 that need their own tools.
# Reports are uploaded as artifacts so findings can be read and triaged.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java:
    name: Coverage, static analysis and mutation testing (Java)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Strict compile, tests with JaCoCo coverage, SpotBugs (Module 4, 5)
        run: mvn -B -ntp -Pquality verify

      - name: Coverage summary
        if: always()
        run: |
          python3 - <<'PY'
          import csv
          rows = list(csv.DictReader(open("target/site/jacoco/jacoco.csv")))
          def pct(missed, covered):
              m = sum(int(r[missed]) for r in rows); c = sum(int(r[covered]) for r in rows)
              return 100 * c / (m + c) if m + c else 0
          print(f"JaCoCo line coverage {pct('LINE_MISSED','LINE_COVERED'):.1f}%, branch coverage {pct('BRANCH_MISSED','BRANCH_COVERED'):.1f}%")
          for pkg in sorted({r["PACKAGE"] for r in rows}):
              sub = [r for r in rows if r["PACKAGE"] == pkg]
              m = sum(int(r["LINE_MISSED"]) for r in sub); c = sum(int(r["LINE_COVERED"]) for r in sub)
              print(f"  {pkg:40s} lines {100*c/(m+c) if m+c else 0:5.1f}%")
          PY

      - name: SpotBugs findings
        if: always()
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET, os
          path = "target/spotbugsXml.xml"
          if not os.path.exists(path):
              print("no SpotBugs report"); raise SystemExit
          bugs = ET.parse(path).getroot().findall("BugInstance")
          print(f"SpotBugs: {len(bugs)} finding(s)")
          for b in bugs:
              src = b.find("SourceLine")
              where = f"{src.get('sourcepath')}:{src.get('start')}" if src is not None else "?"
              print(f"  [{b.get('priority')}] {b.get('type')} {b.get('category')} {where}")
          PY

      - name: PIT mutation testing (Module 5)
        if: always()
        run: mvn -B -ntp -Pquality -Dmaven.compiler.failOnWarning=false test-compile org.pitest:pitest-maven:mutationCoverage

      - name: Mutation summary
        if: always()
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET, os, collections
          path = "target/pit-reports/mutations.xml"
          if not os.path.exists(path):
              print("no PIT report"); raise SystemExit
          ms = ET.parse(path).getroot().findall("mutation")
          status = collections.Counter(m.get("status") for m in ms)
          killed = status["KILLED"] + status["TIMED_OUT"] + status["MEMORY_ERROR"]
          print(f"PIT: {len(ms)} mutants, {killed} killed ({100*killed/len(ms):.1f}%), status {dict(status)}")
          for m in ms:
              if m.get("status") in ("SURVIVED", "NO_COVERAGE"):
                  print(f"  {m.get('status'):11s} {m.findtext('mutatedClass').split('.')[-1]}.{m.findtext('mutatedMethod')}:{m.findtext('lineNumber')} {m.findtext('description')}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-quality-reports
          path: |
            target/site/jacoco/
            target/spotbugsXml.xml
            target/pit-reports/
          retention-days: 30

  portal:
    name: Coverage and dependency audit (portal)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install exactly the locked dependencies (checksums verified by npm ci)
        run: npm ci

      - name: Dependency audit of shipped dependencies (Module 9)
        run: npm audit --omit=dev --audit-level=moderate

      - name: Coverage of the unit and contract suite (Module 5)
        run: npm run -s test:coverage
